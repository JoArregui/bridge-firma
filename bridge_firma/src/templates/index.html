<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Firma Digital</title>
    <style>
        body { font-family: sans-serif; background: #f3f4f6; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; width: 95%; max-width: 800px; padding: 20px; border-radius: 12px; shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .pdf-box { width: 100%; height: 400px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px; }
        canvas { border: 2px dashed #4b5563; background: #fafafa; border-radius: 8px; cursor: crosshair; touch-action: none; width: 100%; height: auto; }
        .btns { display: flex; justify-content: space-around; margin-top: 15px; }
        button { padding: 15px 30px; font-size: 18px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .btn-clear { background: #9ca3af; }
        .btn-save { background: #2563eb; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Documento: {{ num_doc }}</h3>
        <iframe class="pdf-box" src="/pdfs/{{ pdf_file }}"></iframe>
        
        <p>Firme aquí:</p>
        <canvas id="canvas-firma" width="700" height="250"></canvas>

        <div class="btns">
            <button class="btn-clear" onclick="limpiarCanvas()">Limpiar</button>
            <button class="btn-save" onclick="prepararEnvio()">Confirmar Firma</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/firma.js') }}"></script>
    <script>
        function prepararEnvio() {
            enviarFirma("{{ id }}");
        }
    </script>
</body>
</html>
